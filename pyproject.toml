[project]
name = "maintenance-admin"
version = "0.1.0"
description = "维保协同后台管理系统（RBAC）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["aiosqlite>=0.20", "httpx>=0.28", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
