name: ci
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (lane ${{ matrix.lane }}/6)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        # 与 docker-compose.yml 同一镜像
        image: timescale/timescaledb@sha256:6e4b469dee0395a8a6d8c818384b0226a749997a29a312f314413f98e4161f82
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: enterprise_backend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # 集成测试库/实例是一次性的,不要指向业务数据
      TEST_DATABASE_URL: postgresql+asyncpg://admin:admin123@localhost:5432/enterprise_backend_test
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_HISTORY_MIGRATION_DATABASE_URL: postgresql+asyncpg://admin:admin123@localhost:5432/history_migration_test
      TRANSPORT_OWNER_MIGRATION_DATABASE_URL: postgresql+asyncpg://admin:admin123@localhost:5432/transport_owner_migration_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Quiesce background maintenance in the disposable PostgreSQL service
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$TEST_POSTGRES_CONTAINER" psql -X -U admin -d enterprise_backend_test \
            -v ON_ERROR_STOP=1 -c 'ALTER SYSTEM SET autovacuum = off' -c 'SELECT pg_reload_conf()'
          for attempt in {1..10}; do
            if test "$(docker exec "$TEST_POSTGRES_CONTAINER" psql -XAt -U admin \
              -d enterprise_backend_test -c 'SHOW autovacuum')" = off; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Prepare isolated migration stores
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          from sqlalchemy.engine import make_url
          from tests.migration_helpers import migration_database_ddl

          async def prepare():
              for key in ("TEST_HISTORY_MIGRATION_DATABASE_URL", "TRANSPORT_OWNER_MIGRATION_DATABASE_URL"):
                  database = make_url(os.environ[key]).database
                  await migration_database_ddl(os.environ["TEST_DATABASE_URL"], database, create=True)

          asyncio.run(prepare())
          PY
      - run: uv run pytest --test-lane=${{ matrix.lane }}/6 -ra --durations=30 --junitxml=test-results.xml

  test:
    runs-on: ubuntu-24.04
    needs: pytest
    if: ${{ always() }}
    steps:
      - name: Require every test group to pass
        env:
          PYTEST_RESULT: ${{ needs.pytest.result }}
        run: test "$PYTEST_RESULT" = success
