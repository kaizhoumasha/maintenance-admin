name: ci
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.group }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: migrations
            args: tests/migrations
          - group: workflows
            args: tests/businesses/bin_roller tests/businesses/smt_manual
          - group: remaining
            args: >-
              --ignore=tests/migrations
              --ignore=tests/businesses/bin_roller
              --ignore=tests/businesses/smt_manual
    services:
      postgres:
        # 与 docker-compose.yml 同一镜像
        image: timescale/timescaledb@sha256:6e4b469dee0395a8a6d8c818384b0226a749997a29a312f314413f98e4161f82
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: enterprise_backend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # 集成测试库/实例是一次性的,不要指向业务数据
      TEST_DATABASE_URL: postgresql+asyncpg://admin:admin123@localhost:5432/enterprise_backend_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest ${{ matrix.args }} -ra --durations=30 --durations-min=1

  test:
    runs-on: ubuntu-24.04
    needs: pytest
    if: ${{ always() }}
    steps:
      - name: Require every test group to pass
        env:
          PYTEST_RESULT: ${{ needs.pytest.result }}
        run: test "$PYTEST_RESULT" = success
