# 同域 HTTP 配置:前端静态文件 + /api 反代。HTTPS 由外层 nginx/网关终止(见 docs/deploy.md)。
# 127.0.0.11 是 Docker 内置 DNS;proxy_pass 用变量才会重新解析,api 扩容/重建后无需重启 nginx。
# 多机部署时把 resolver/set 换成 upstream { server 10.0.0.1:8000; server 10.0.0.2:8000; }。
resolver 127.0.0.11 valid=10s ipv6=off;

# 访问日志不含查询串(用户列表的邮箱/用户名筛选在 query 里)和 Referer;$uri 不带参数
log_format noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log noquery;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加:客户端自带的 X-Forwarded-For 不能传给 api。
        # 前面还有外层网关时,用 set_real_ip_from/real_ip_header 还原 $remote_addr(见 docs/deploy.md)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite 产物带 hash,可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # vue-router history 模式:未知路径回落到 index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
